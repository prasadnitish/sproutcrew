[package]
name = "bff-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
lopdf = "0.46.0"
ureq = "3"
flate2 = "1"
calamine = { version = "0.38", default-features = false }
cfb = "0.16"
docx-rs = { version = "=0.4.22", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
base64 = "0.22"
ed25519-dalek = "2.2"
plist = "1"

[build-dependencies]
serde_json = "1"
